<h1>通讯助手已安装成功</h1>
<p>关闭安装器后，在访达的“应用程序”中打开“通讯助手”。</p>
<h2>接下来</h2>
<ol><li>登录 Telegram，或确认已保存的账号；普通使用无需编辑配置文件。</li><li>测试系统通知，按需选择归档会话。</li><li>检查回复对象、提示和回复内容，预览后再确认开启自动回复。</li></ol>
<p>关闭窗口后继续在菜单栏运行；退出应用、睡眠、合盖或断网期间不能实时处理。</p>
<p>安装成功不等于账号已登录、自动回复已开启或实际考勤已登记，请在应用内逐项确认。</p>
</body></html>
