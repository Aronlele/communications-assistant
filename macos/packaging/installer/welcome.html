<h1>欢迎安装通讯助手</h1>
<p>Mac 上的 Telegram 通讯工作台，提供多账号连接、消息提醒、本地归档和由你配置的自动回复。</p>
<h2>无需拖拽，也无需准备开发环境</h2>
<p>点击“继续”，按向导完成安装。应用与独立消息引擎已包含在安装包内，不需要 Python、Docker 或终端。</p>
<p>本应用使用 Telegram API，是独立的第三方辅助工具，并非 Telegram 官方客户端。</p>
