name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: macos/requirements-build.txt
      - run: python -m pip install -r macos/requirements-build.txt
      - run: bash scripts/test.sh
      - run: git diff --check
  native-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: test "$(uname -m)" = arm64
      - run: bash scripts/test-native.sh
      - run: bash macos/scripts/build.sh
      - run: python3 macos/scripts/smoke.py output/macos/通讯助手.app/Contents/Resources/Engine/tgengine
      - run: python3 macos/scripts/smoke_service_messages.py output/macos/通讯助手.app/Contents/Resources/Engine/tgengine
      - run: codesign --verify --deep --strict output/macos/通讯助手.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-arm64-development-no-api
          path: |
            output/macos/*.pkg
            output/macos/*.dmg
            output/macos/*.zip
          retention-days: 7
