name: Internal release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing main version tag, such as v0.4.0
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Check tag and source version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(uname -m)" = arm64
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' macos/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - run: python3 -m pip install -r macos/requirements-build.txt
      - run: bash scripts/test.sh
      - run: bash scripts/test-native.sh
      - name: Build with maintainer-provided configuration
        env:
          API_CONFIGURATION_JSON: ${{ secrets.TELEGRAM_API_CONFIG }}
        run: |
          test -n "$API_CONFIGURATION_JSON" || { echo 'Configure TELEGRAM_API_CONFIG before releasing a connected build'; exit 1; }
          config="$RUNNER_TEMP/TelegramAPI.json"
          umask 077
          trap 'rm -f "$config"' EXIT
          printf '%s' "$API_CONFIGURATION_JSON" > "$config"
          TGA_API_CONFIG="$config" TGA_RELEASE=1 bash macos/scripts/build.sh
      - run: python3 macos/scripts/smoke.py output/macos/通讯助手.app/Contents/Resources/Engine/tgengine
      - run: codesign --verify --deep --strict output/macos/通讯助手.app
      - run: hdiutil verify output/macos/通讯助手-*-arm64.dmg
      - run: python3 scripts/prepare_release.py --source output/macos
      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" output/releases/"$RELEASE_TAG"/* --verify-tag --prerelease --title "即讯 $RELEASE_TAG 测试版" --notes-file design/release-notes.md
